name: Verify S3 configuration precedence

on:
  push:
    branches: [validation/s3-config-precedence-330]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Install Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup default nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - uses: ./.github/actions/setup-foundationdb-client
      - name: Formatting
        run: cargo fmt --all --check
      - name: Mosaic binary tests
        run: cargo test --locked -p mosaic --all-features
      - name: Strict Mosaic Clippy
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --locked -p mosaic --all-features --all-targets
      - name: Verify compatibility and original behavior regressions
        shell: bash
        run: |
          set -euo pipefail
          source_file=bin/mosaic/src/s3.rs
          backup_file="$RUNNER_TEMP/mosaic-s3-fixed.rs"
          cp "$source_file" "$backup_file"
          trap 'cp "$backup_file" "$source_file"' EXIT
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          path = Path("bin/mosaic/src/s3.rs")
          source = path.read_text()
          initial = subprocess.check_output(["git", "show", "71c68938974ed9db442742165ea81a7a7c384b47:bin/mosaic/src/s3.rs"], text=True)
          prefix = initial.split("#[cfg(test)]", 1)[0]
          tests = source.split("#[cfg(test)]", 1)[1]
          path.write_text(prefix + "#[cfg(test)]" + tests)
          PY
          compatibility_log="$RUNNER_TEMP/s3-independent-options.log"
          if cargo test --locked -p mosaic --all-features s3::tests::static_credentials_preserve_independent_environment_options -- --exact --nocapture > "$compatibility_log" 2>&1; then
            cat "$compatibility_log"
            echo "Compatibility regression unexpectedly passed on the initial patch"
            exit 1
          fi
          cat "$compatibility_log"
          grep -q 'test result: FAILED' "$compatibility_log"
          grep -q 'assertion' "$compatibility_log"
          echo "Expected independent-options assertion failure confirmed"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("bin/mosaic/src/s3.rs")
          source = path.read_text()
          old = """let mut builder = if access_key_id.is_some() && secret_access_key.is_some() {
                  AmazonS3Builder::new()
              } else {
                  AmazonS3Builder::from_env()
              };"""
          assert source.count(old) == 1
          source = source.replace(old, "let mut builder = AmazonS3Builder::from_env();")
          old_endpoint = "builder.with_config(AmazonS3ConfigKey::S3Endpoint, endpoint)"
          assert source.count(old_endpoint) == 1
          source = source.replace(old_endpoint, "builder.with_endpoint(endpoint)")
          path.write_text(source)
          PY
          for test_name in static_credentials_ignore_ambient_token configured_endpoint_overrides_s3_environment; do
            log_file="$RUNNER_TEMP/$test_name.log"
            if cargo test --locked -p mosaic --all-features "s3::tests::$test_name" -- --exact --nocapture > "$log_file" 2>&1; then
              cat "$log_file"
              echo "Regression unexpectedly passed with original behavior: $test_name"
              exit 1
            fi
            cat "$log_file"
            grep -q 'test result: FAILED' "$log_file"
            grep -q 'assertion' "$log_file"
            echo "Expected assertion failure confirmed: $test_name"
          done
          cp "$backup_file" "$source_file"
          git diff --exit-code -- bin/mosaic/src
